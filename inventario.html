<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de productos</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#1c1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--accent2:#7c3aed;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--warnbg:#fef3c7;--shadow:0 4px 18px rgba(20,30,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1217;--card:#1a1f27;--text:#e8eaed;--muted:#9aa3af;--line:#2b323c;--accent:#818cf8;--accent2:#a78bfa;--warnbg:#3a2e0f;--shadow:0 4px 18px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1217;--card:#1a1f27;--text:#e8eaed;--muted:#9aa3af;--line:#2b323c;--accent:#818cf8;--accent2:#a78bfa;--warnbg:#3a2e0f;--shadow:0 4px 18px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;min-height:100vh}
button{font:inherit;cursor:pointer}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:1rem;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.pri{padding:11px 16px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;transition:.2s}
.pri:hover{transform:translateY(-1px);filter:brightness(1.08)}
.ghost{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);transition:.2s}
.ghost:hover{border-color:var(--accent)}
#login{max-width:360px;margin:12vh auto 0;background:var(--card);border-radius:18px;padding:28px 24px;text-align:center;box-shadow:var(--shadow);animation:pop .5s ease}
#login .logo{font-size:3rem}#login h1{margin:4px 0}#login p{color:var(--muted);margin:0 0 16px}#login input{margin-bottom:12px;text-align:center}
#app{display:none;max-width:1000px;margin:0 auto;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--shadow);margin-bottom:14px}
.top h1{margin:0;font-size:1.2rem}.top small{opacity:.85}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:700}
.top .ghost{background:rgba(255,255,255,.18);color:#fff;border-color:transparent;padding:6px 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.35rem}.stat span{color:var(--muted);font-size:.78rem}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font-size:.85rem;transition:.2s}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wrap{overflow-x:auto;background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:780px;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.72rem;text-transform:uppercase;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
th:hover{color:var(--accent)}
td.n,th.n{text-align:right}
tbody tr{animation:pop .3s ease;transition:background .15s}tbody tr:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.badge{padding:3px 9px;border-radius:999px;font-size:.75rem;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.stk{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.stk button{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--text);line-height:1}
.stk button:hover{background:var(--accent);color:#fff}
.meter{width:54px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;border-radius:9px}
.act button{border:0;background:none;font-size:1.05rem;padding:4px}
.empty{padding:28px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:20px;background:var(--card);color:var(--text);width:min(92vw,380px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
dialog label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;transition:.3s;z-index:99;box-shadow:var(--shadow)}
#toast.show{transform:translate(-50%,0)}#toast button{margin-left:8px;border:0;background:none;color:#a5b4fc;font-weight:600}
</style>
</head>
<body>
<div id="login">
<div class="logo">📦</div><h1>Inventario</h1>
<p>Escribe tu usuario para comenzar</p>
<input id="user" placeholder="Usuario" autocomplete="username">
<button class="pri" id="go" style="width:100%">Entrar</button>
</div>

<div id="app">
<div class="top">
<div class="who"><div class="av" id="av">U</div><div><h1>Hola, <span id="who"></span></h1><small>Panel de inventario</small></div></div>
<div style="display:flex;gap:6px"><button class="ghost" id="theme" title="Cambiar tema">🌓</button><button class="ghost" id="out">Salir</button></div>
</div>
<div class="stats">
<div class="stat"><b id="sP">0</b><span>Productos</span></div>
<div class="stat"><b id="sU">0</b><span>Unidades</span></div>
<div class="stat"><b id="sV">$0</b><span>Valor total</span></div>
<div class="stat"><b id="sL">0</b><span>Stock bajo</span></div>
</div>
<div class="bar">
<input id="q" placeholder="🔍 Buscar producto o código…">
<button class="ghost" id="low">⚠️ Stock bajo</button>
<button class="ghost" id="csv">⬇️ CSV</button>
<button class="pri" id="add">+ Nuevo</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap"><table>
<thead><tr><th data-k="c">Código</th><th data-k="n">Producto</th><th data-k="cat">Categoría</th><th data-k="s" class="n">Stock</th><th data-k="p" class="n">Precio</th><th data-k="t" class="n">Total</th><th></th></tr></thead>
<tbody id="tb"></tbody></table><div class="empty" id="empty" style="display:none">No hay productos que coincidan.</div></div>
</div>

<dialog id="dlg">
<h3 id="dt" style="margin:0">Producto</h3>
<label>Nombre</label><input id="fn">
<label>Categoría</label><select id="fc"><option>PC</option><option>Laptop</option><option>Teléfono</option><option>Maquillaje</option></select>
<label>Stock</label><input id="fs" type="number" min="0">
<label>Precio ($)</label><input id="fp" type="number" min="0" step="0.01">
<div class="row"><button class="ghost" id="cx">Cancelar</button><button class="pri" id="sv">Guardar</button></div>
</dialog>
<div id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};
var ICON={PC:"🖥️",Laptop:"💻","Teléfono":"📱",Maquillaje:"💄"};
var KEY="inv_data_v2",D=null,cat="Todos",onlyLow=false,sort={k:"c",d:1},editId=null,tt;
var SEED=[
["PC","Dell OptiPlex 3000",12,650],["PC","HP ProDesk 400 G9",8,720],["PC","Lenovo ThinkCentre M70",15,680],["PC","Acer Veriton X",6,540],["PC","ASUS ExpertCenter D5",9,610],["PC","iMac 24″ M3",4,1450],["PC","HP All-in-One 24",7,780],["PC","MSI PRO DP21",3,590],["PC","Lenovo IdeaCentre 3",10,560],["PC","Dell Inspiron Desktop",11,700],
["Laptop","Lenovo IdeaPad 3",20,480],["Laptop","HP Pavilion 15",14,640],["Laptop","Dell Inspiron 15",16,590],["Laptop","ASUS VivoBook 15",18,520],["Laptop","Acer Aspire 5",13,500],["Laptop","MacBook Air M2",5,1150],["Laptop","MSI Modern 14",7,670],["Laptop","HP 255 G9",22,420],["Laptop","Lenovo ThinkPad E14",9,810],["Laptop","ASUS TUF Gaming F15",4,980],
["Teléfono","Samsung Galaxy A15",40,190],["Teléfono","iPhone 13",12,620],["Teléfono","Xiaomi Redmi Note 13",35,210],["Teléfono","Motorola Moto G54",28,180],["Teléfono","Samsung Galaxy S23",8,740],["Teléfono","iPhone 15",6,860],["Teléfono","Oppo A78",20,200],["Teléfono","Realme C55",25,150],["Teléfono","Honor X7b",17,220],["Teléfono","Google Pixel 7a",3,430],
["Maquillaje","Base líquida Fit Me",60,9],["Maquillaje","Labial Ruby Woo",45,22],["Maquillaje","Máscara de pestañas Voluminous",80,11],["Maquillaje","Paleta de sombras Naked",15,54],["Maquillaje","Rubor NYX Cream",50,10],["Maquillaje","Delineador líquido negro",70,12],["Maquillaje","Corrector Instant Age",55,10],["Maquillaje","Iluminador Fenty",2,38],["Maquillaje","Polvo compacto Revlon",40,13],["Maquillaje","Set de brochas Real Techniques",18,28]
].map(function(r,i){return{id:i+1,cat:r[0],n:r[1],s:r[2],p:r[3]}});
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!D.length)D=SEED;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function code(d){return"INV-"+String(d.id).padStart(3,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(v){return"$"+v.toLocaleString("es",{maximumFractionDigits:2})}
function toast(m,fn){var t=$("toast");t.innerHTML=esc(m)+(fn?"<button id='undo'>Deshacer</button>":"");t.className="show";if(fn)$("undo").onclick=function(){fn();t.className=""};clearTimeout(tt);tt=setTimeout(function(){t.className=""},4000)}
function anim(el,to,fmt){var from=parseFloat(el.dataset.v||0),t0=performance.now();el.dataset.v=to;(function f(n){var k=Math.min(1,(n-t0)/400);el.textContent=fmt(Math.round(from+(to-from)*k));if(k<1)requestAnimationFrame(f)})(t0)}
function view(){
 var t=$("q").value.toLowerCase();
 var L=D.filter(function(d){return(cat=="Todos"||d.cat==cat)&&(!onlyLow||d.s<5)&&(d.n+code(d)).toLowerCase().indexOf(t)>-1});
 L.sort(function(a,b){var x=sort.k=="c"?a.id:sort.k=="t"?a.s*a.p:a[sort.k],y=sort.k=="c"?b.id:sort.k=="t"?b.s*b.p:b[sort.k];return(x>y?1:x<y?-1:0)*sort.d});
 return L}
function render(){
 var L=view();
 $("tb").innerHTML=L.map(function(d){
  var pc=Math.min(100,d.s/60*100),col=d.s<5?"var(--bad)":d.s<10?"var(--warn)":"var(--ok)";
  return"<tr data-id='"+d.id+"'><td>"+code(d)+"</td><td>"+ICON[d.cat]+" "+esc(d.n)+"</td><td><span class='badge'>"+d.cat+"</span></td>"+
  "<td class='n'><div class='stk'><button data-a='dec'>−</button><b>"+d.s+"</b><button data-a='inc'>+</button><div class='meter'><i style='width:"+pc+"%;background:"+col+"'></i></div></div></td>"+
  "<td class='n'>"+money(d.p)+"</td><td class='n'>"+money(d.s*d.p)+"</td><td class='act n'><button data-a='edit' title='Editar'>✏️</button><button data-a='del' title='Eliminar'>🗑️</button></td></tr>"}).join("");
 $("empty").style.display=L.length?"none":"block";
 anim($("sP"),L.length,String);
 anim($("sU"),L.reduce(function(a,d){return a+d.s},0),String);
 anim($("sV"),L.reduce(function(a,d){return a+d.s*d.p},0),money);
 anim($("sL"),L.filter(function(d){return d.s<5}).length,String);
 [].forEach.call(document.querySelectorAll("th[data-k]"),function(h){var b=h.textContent.replace(/ [▲▼]/,"");h.textContent=b+(h.dataset.k==sort.k?(sort.d>0?" ▲":" ▼"):"")});
}
function mark(){[].forEach.call(document.querySelectorAll(".tabs button"),function(b){b.className=b.dataset.c==cat?"on":""})}
$("tabs").innerHTML=["Todos","PC","Laptop","Teléfono","Maquillaje"].map(function(c){return"<button data-c='"+c+"'>"+(ICON[c]||"📋")+" "+c+"</button>"}).join("");
$("tabs").onclick=function(e){var b=e.target.closest("button");if(b){cat=b.dataset.c;mark();render()}};
$("q").oninput=render;
$("low").onclick=function(){onlyLow=!onlyLow;this.style.borderColor=onlyLow?"var(--warn)":"";render()};
document.querySelector("thead").onclick=function(e){var k=e.target.dataset.k;if(!k)return;sort=sort.k==k?{k:k,d:-sort.d}:{k:k,d:1};render()};
$("tb").onclick=function(e){
 var b=e.target.closest("button");if(!b)return;
 var id=+b.closest("tr").dataset.id,d=D.filter(function(x){return x.id==id})[0],a=b.dataset.a;
 if(a=="inc"){d.s++}else if(a=="dec"){d.s=Math.max(0,d.s-1)}
 else if(a=="edit"){open(d)}
 else if(a=="del"){var i=D.indexOf(d);D.splice(i,1);save();render();toast("Producto eliminado",function(){D.splice(i,0,d);save();render()});return}
 save();render()};
function open(d){editId=d?d.id:null;$("dt").textContent=d?"Editar producto":"Nuevo producto";$("fn").value=d?d.n:"";$("fc").value=d?d.cat:"PC";$("fs").value=d?d.s:0;$("fp").value=d?d.p:0;$("dlg").showModal();$("fn").focus()}
$("add").onclick=function(){open(null)};
$("cx").onclick=function(){$("dlg").close()};
$("sv").onclick=function(){
 var n=$("fn").value.trim();if(!n){$("fn").focus();return}
 var o={n:n,cat:$("fc").value,s:Math.max(0,+$("fs").value||0),p:Math.max(0,+$("fp").value||0)};
 if(editId){Object.assign(D.filter(function(x){return x.id==editId})[0],o);toast("Producto actualizado")}
 else{o.id=D.reduce(function(m,x){return Math.max(m,x.id)},0)+1;D.push(o);toast("Producto agregado")}
 save();$("dlg").close();render()};
$("csv").onclick=function(){
 try{var rows=[["Código","Producto","Categoría","Stock","Precio","Total"]].concat(view().map(function(d){return[code(d),d.n,d.cat,d.s,d.p,d.s*d.p]}));
 var s=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));a.download="inventario.csv";a.click();toast("CSV exportado")}catch(e){toast("No se pudo exportar")}};
$("theme").onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("inv_theme",r.dataset.theme)}catch(e){}};
try{var th=localStorage.getItem("inv_theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
function show(u){$("login").style.display="none";$("app").style.display="block";$("who").textContent=u;$("av").textContent=u.charAt(0).toUpperCase();mark();render()}
function enter(){var v=$("user").value.trim();if(!v){$("user").focus();return}try{localStorage.setItem("inv_user",v)}catch(e){}show(v)}
$("go").onclick=enter;
$("user").onkeydown=function(e){if(e.key=="Enter")enter()};
$("out").onclick=function(){try{localStorage.removeItem("inv_user")}catch(e){}$("user").value="";$("app").style.display="none";$("login").style.display="block"};
try{var u=localStorage.getItem("inv_user");if(u)show(u)}catch(e){}
</script>
</body>
</html>
